spring.application.name=Fruitful

spring.datasource.url=jdbc:postgresql://localhost:5432/fruitful-postgres
spring.datasource.username=postgres


spring.jpa.hibernate.ddl-auto=validate

fruitful.security.jwt.secret-key=${JWT_SECRET}
fruitful.security.jwt.access-token-expiration-ms=900000
fruitful.security.jwt.refreh-token-expiration-ms=604800000

management.endpoints.web.exposure.include=health

fruitful.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
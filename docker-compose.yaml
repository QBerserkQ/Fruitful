services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: fruitful
      POSTGRES_USER: fruitful
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fruitful"]
      interval: 5s
      retries: 10

  backend:
    build: .
    depends_on:
      db:
        condition: service_healthy

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/fruitful
      SPRING_DATASOURCE_USERNAME: fruitful
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8081:8080"

volumes:
  pgdata:
